  class PieceView {
    constructor(p, r, c) {
      this.id = p.id;
      this.color = p.color;
      this.kind = p.kind;
      this.hp = p.hp || 0;
      this.x = c;
      this.y = r;
      this.ty = r;
      this.vy = 0;
      this.falling = false;
      this.delay = 0;
      this.squash = 0;
      this.pop = -1;
      this.gather = null;
      this.popFace = 'happy';
      this.appear = -1;
      this.blinkT = 1 + Math.random() * 6;
      this.blink = 0;
      this.flash = 0;
      this.shake = 0;
      this.move = null;
    }
    update(dt) {
      if (this.delay > 0) {
        this.delay -= dt;
        if (this.delay > 0) return;
      }
      if (this.falling) {
        this.vy = Math.min(this.vy + 70 * dt, 22);
        this.y += this.vy * dt;
        if (this.y >= this.ty) {
          this.y = this.ty;
          this.falling = false;
          this.vy = 0;
          this.squash = 1;
        }
      }
      if (this.move) {
        const m = this.move;
        m.t += dt;
        const k = Math.min(1, m.t / m.dur);
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        this.x = m.fx + (m.tx - m.fx) * e;
        this.y = m.fy + (m.ty - m.fy) * e - (m.arc || 0) * Math.sin(k * Math.PI);
        if (k >= 1) {
          this.x = m.tx;
          this.y = m.ty;
          this.move = null;
        }
      }
      if (this.squash > 0) this.squash = Math.max(0, this.squash - dt * 7);
      this.blinkT -= dt;
      if (this.blinkT < 0) {
        this.blink = 0.13;
        this.blinkT = 2 + Math.random() * 6;
      }
      if (this.blink > 0) this.blink -= dt;
      if (this.pop >= 0) this.pop += dt;
      if (this.appear >= 0) {
        this.appear += dt;
        if (this.appear > 0.35) this.appear = -1;
      }
      if (this.flash > 0) this.flash -= dt;
      if (this.shake > 0) this.shake -= dt;
    }
  }

  function renderBoard(mask) {
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const on = (r, cc) => r >= 0 && cc >= 0 && r < 8 && cc < 8 && mask[r][cc];
    const layer = (pad, color, dy) => {
      g.fillStyle = color;
      for (let r = 0; r < 8; r++) for (let cc = 0; cc < 8; cc++) if (on(r, cc)) g.fillRect(BX + cc * TILE - pad, BY + r * TILE - pad + (dy || 0), TILE + pad * 2, TILE + pad * 2);
    };
    layer(5, '#f2bfd3', 3);
    layer(5, C.frameDark);
    layer(4, C.frame);
    layer(2, '#ffd9e7');
    layer(1, '#f0bcd0');
    for (let r = 0; r < 8; r++) {
      for (let cc = 0; cc < 8; cc++) {
        if (!on(r, cc)) continue;
        for (const [dr, dc] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) {
          if (on(r + dr, cc) || on(r, cc + dc) || on(r + dr, cc + dc)) continue;
          const x = dc < 0 ? BX + cc * TILE - 5 : BX + (cc + 1) * TILE + 4;
          const y = dr < 0 ? BY + r * TILE - 5 : BY + (r + 1) * TILE + 4;
          g.clearRect(x, y, 1, 1);
          g.clearRect(x - dc, y, 1, 1);
          g.clearRect(x, y - dr, 1, 1);
          g.fillStyle = C.frameDark;
          g.fillRect(x - dc, y - dr, 1, 1);
        }
      }
    }
    for (let r = 0; r < 8; r++) {
      for (let cc = 0; cc < 8; cc++) {
        if (!on(r, cc)) continue;
        g.fillStyle = (r + cc) % 2 ? C.tileB : C.tileA;
        g.fillRect(BX + cc * TILE, BY + r * TILE, TILE, TILE);
      }
    }
    return c;
  }

  const checkIcon = () => lazyIcon('check', ['.....kk', '....kk.', 'kk.kk..', '.kkk...', '..k....'], { k: '#2b9c6a' });

  // ============================================================= play scene
  class PlayScene {
    constructor(index) {
      this.name = 'play';
      this.index = index;
      this.cozy = index < 0;
      this.level = this.cozy ? E.COZY : E.LEVELS[index];
      this.s = E.newGame(this.level, URL_SEED || (Math.random() * 2147483647) >>> 0);
      this.views = new Map();
      this.cells = Array.from({ length: 8 }, () => new Array(8).fill(null));
      this.hearts = this.s.hearts.map((r) => r.slice());
      this.view = { collected: [0, 0, 0, 0, 0, 0], heartsLeft: this.s.progress.heartsLeft, boxes: 0, moves: this.s.movesLeft, score: 0 };
      this.scoreShown = 0;
      this.selected = null;
      this.cursor = null;
      this.drag = null;
      this.busy = true;
      this.effects = [];
      this.popups = [];
      this.callout = null;
      this.shakeMag = 0;
      this.idle = 0;
      this.hint = null;
      this.overlay = null;
      this.warned = {};
      this.mascot = { expr: 'open', exprT: 0, blinkT: 2, blink: 0, hop: 0, say: null, sayT: 0 };
      this.t = 0;
      this.board = renderBoard(this.s.mask);
      this.clip = new Path2D();
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (this.s.mask[r][c]) this.clip.rect(BX + c * TILE, BY + r * TILE, TILE, TILE);
      this.buttons = [new Button(160, 4, 17, 17, '', () => this.pause(), { label: 'PAUSE', icon: (cx, cy, st) => blit(pauseIcon(st.text), cx, cy) })];
      this.goals = E.goalProgress(this.s);
    }

    async enter() {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = this.s.grid[r][c];
          if (!p) continue;
          const v = new PieceView(p, r - 9, c);
          v.ty = r;
          v.falling = true;
          v.delay = 0.2 + c * 0.04 + (7 - r) * 0.03;
          this.addView(v, r, c);
        }
      }
      await sleep(0.4);
      const intro = this.level.intro;
      if (intro && !save.seen[intro]) {
        save.seen[intro] = 1;
        persist();
        await this.showIntro(intro);
      }
      if (!this.cozy) await this.showBanner();
      await waitFor(() => [...this.views.values()].every((v) => !v.falling && v.delay <= 0));
      this.say(this.cozy ? pickOne(LINES.cozy) : this.level.tip || pickOne(LINES.start), 5);
      this.busy = false;
    }

    addView(v, r, c) {
      this.views.set(v.id, v);
      this.cells[r][c] = v;
    }
    px(r, c) { return [BX + c * TILE + TILE / 2, BY + r * TILE + TILE / 2]; }
    frozen() { return !!this.overlay && this.overlay.type === 'pause'; }

    // ------------------------------------------------------------ mascot
    say(text, secs) {
      this.mascot.say = text;
      this.mascot.sayT = secs || 3;
    }
    face(expr, secs) {
      this.mascot.expr = expr;
      this.mascot.exprT = secs || 1;
    }
    poke() {
      this.idle = 0;
      this.hint = null;
      if (this.mascot.expr === 'sleep') {
        this.face('open', 0.1);
        this.mascot.say = null;
        this.mascot.sayT = 0;
      }
    }

    // ------------------------------------------------------------- input
    cellAt(x, y) {
      const c = Math.floor((x - BX) / TILE), r = Math.floor((y - BY) / TILE);
      if (r < 0 || c < 0 || r > 7 || c > 7 || !this.s.mask[r][c]) return null;
      return [r, c];
    }
    down(x, y) {
      if (this.overlay) return this.overlayDown(x, y);
      if (buttonsDown(this.buttons, x, y)) return;
      this.poke();
      const cell = this.cellAt(x, y);
      if (cell) this.tapCell(cell, x, y);
    }
    tapCell(cell, x, y) {
      if (this.busy) return;
      const v = this.cells[cell[0]][cell[1]];
      if (!v) return;
      if (v.kind === 'x') {
        v.shake = 0.25;
        Sound.sfx.box();
        this.say(LINES.nap[0], 2.5);
        this.selected = null;
        return;
      }
      if (this.selected) {
        const [sr, sc] = this.selected;
        if (sr === cell[0] && sc === cell[1]) {
          if (x != null) this.drag = { cell, x, y, reTap: true };
          else if (E.isSpecial(v)) this.tapSpecial(cell);
          else this.selected = null;
          return;
        }
        if (Math.abs(sr - cell[0]) + Math.abs(sc - cell[1]) === 1) {
          this.trySwap(this.selected, cell);
          return;
        }
      }
      this.selected = cell;
      Sound.sfx.select();
      if (E.isSpecial(v) && !save.seen.tapTip) {
        save.seen.tapTip = 1;
        persist();
        this.say('TAP IT AGAIN TO SET IT OFF, OR SWAP IT!', 3);
      }
      if (x != null) this.drag = { cell, x, y };
    }
    move(x, y) {
      if (!this.drag || this.busy || this.overlay) return;
      const dx = x - this.drag.x, dy = y - this.drag.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 7) return;
      const [r, c] = this.drag.cell;
      const to = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
      this.drag = null;
      if (to[0] >= 0 && to[1] >= 0 && to[0] < 8 && to[1] < 8 && this.cells[to[0]][to[1]]) this.trySwap([r, c], to);
    }
    up(x, y) {
      const d = this.drag;
      this.drag = null;
      if (this.overlay) return this.overlayUp(x, y);
      if (d && d.reTap && !this.busy) {
        const v = this.cells[d.cell[0]][d.cell[1]];
        if (v && E.isSpecial(v)) this.tapSpecial(d.cell);
        else this.selected = null;
      }
      buttonsUp(this.buttons, x, y);
    }
    key(k) {
      if (this.overlay) return this.overlayKey(k);
      if (k === 'Escape') {
        if (this.selected) this.selected = null;
        else this.pause();
        return true;
      }
      const dirs = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
      if (!dirs[k] && k !== 'Enter' && k !== ' ') return false;
      this.poke();
      if (!this.cursor) {
        this.cursor = this.selected ? this.selected.slice() : [4, 3];
        if (!dirs[k]) return true;
      }
      if (dirs[k]) {
        const [dr, dc] = dirs[k];
        const base = this.selected || this.cursor;
        const to = [Math.max(0, Math.min(7, base[0] + dr)), Math.max(0, Math.min(7, base[1] + dc))];
        if (this.selected && !this.busy) {
          if (this.cells[to[0]][to[1]] && (to[0] !== base[0] || to[1] !== base[1])) this.trySwap(this.selected, to);
          this.selected = null;
        }
        this.cursor = to;
        return true;
      }
      this.tapCell(this.cursor);
      return true;
    }

    // -------------------------------------------------------------- turns
    async trySwap(a, b) {
      if (this.busy) return;
      const va = this.cells[a[0]][a[1]], vb = this.cells[b[0]][b[1]];
      if (!va || !vb || va.kind === 'x' || vb.kind === 'x') {
        if ((va && va.kind === 'x') || (vb && vb.kind === 'x')) this.say(LINES.nap[0], 2.5);
        this.selected = null;
        return;
      }
      this.busy = true;
      this.selected = null;
      this.drag = null;
      this.poke();
      const res = E.playMove(this.s, { type: 'swap', a, b });
      if (res.ok && E.status(this.s) === 'won') this.secureWin();
      Sound.sfx.swap();
      await this.animSwap(a, b, 0.15);
      if (!res.ok) {
        Sound.sfx.bad();
        this.face('squeeze', 0.8);
        this.say(pickOne(LINES.nope), 2);
        await this.animSwap(b, a, 0.15);
        va.shake = vb.shake = 0.2;
        this.busy = false;
        return;
      }
      if (E.isSpecial(va) && E.isSpecial(vb)) {
        this.say(pickOne(LINES.combo), 2.5);
        this.face('wow', 1.5);
      }
      await this.runTurn(res);
    }

    async animSwap(a, b, dur) {
      const va = this.cells[a[0]][a[1]], vb = this.cells[b[0]][b[1]];
      va.move = { fx: a[1], fy: a[0], tx: b[1], ty: b[0], t: 0, dur };
      vb.move = { fx: b[1], fy: b[0], tx: a[1], ty: a[0], t: 0, dur };
      this.cells[a[0]][a[1]] = vb;
      this.cells[b[0]][b[1]] = va;
      await sleep(dur + 0.01);
    }

    async tapSpecial(cell) {
      if (this.busy) return;
      this.busy = true;
      this.selected = null;
      const res = E.playMove(this.s, { type: 'tap', a: cell });
      if (!res.ok) {
        this.busy = false;
        return;
      }
      if (E.status(this.s) === 'won') this.secureWin();
      const v = this.cells[cell[0]][cell[1]];
      if (v) v.flash = 0.2;
      Sound.sfx.zing();
      await sleep(0.08);
      await this.runTurn(res);
    }

    async runTurn(res) {
      this.view.moves = this.s.movesLeft;
      for (const st of res.steps) await this.playStep(st);
      if (res.shuffle) await this.playShuffle(res.shuffle);
      this.syncView();
      await this.afterTurn();
    }

    syncView() {
      const pr = this.s.progress;
      this.view.collected = pr.collected.slice();
      this.view.heartsLeft = pr.heartsLeft;
      this.view.boxes = pr.boxesWoken;
      this.view.score = this.s.score;
      this.view.moves = this.s.movesLeft;
      this.hearts = this.s.hearts.map((r) => r.slice());
    }

    async playStep(st) {
      const gather = new Map();
      for (const g of st.groups) if (g.special) for (const [r, c] of g.cells) gather.set(r * 8 + c, g.spawn);
      if (st.cascade >= 1) this.showCallout(CALLOUTS[Math.min(st.cascade - 1, CALLOUTS.length - 1)], false, st.cascade);
      if (st.clears.length >= 18 && !st.combo) {
        this.say(pickOne(LINES.big), 1.8);
        this.face('wow', 1.2);
      }
      let n = 0;
      for (const cl of st.clears) at(cl.t, () => this.popClear(cl, gather.get(cl.r * 8 + cl.c), n++, st.cascade));
      for (const tr of st.transforms) at(tr.t, () => this.transform(tr));
      for (const ef of st.effects) at(ef.t, () => this.startEffect(ef));
      for (const bh of st.boxHits) if (bh.hp > 0) at(bh.t, () => this.boxHit(bh));
      for (const h of st.hearts) at(h.t, () => this.heartPop(h));
      for (const cr of st.created) at(cr.t, () => this.createSpecial(cr));
      for (const pp of st.popups) at(pp.t, () => this.addPopup(pp));
      await sleep(st.duration + POP + 0.02);
      this.view.score = Math.max(this.view.score, st.scoreAfter);
      this.fall(st);
      await waitFor(() => {
        for (const v of this.views.values()) if (v.falling || v.delay > 0 || v.move) return false;
        return true;
      });
      await sleep(0.03);
    }

    popClear(cl, gatherTo, i, cascade) {
      const v = this.views.get(cl.id);
      if (!v || v.pop >= 0) return;
      if (this.cells[cl.r][cl.c] === v) this.cells[cl.r][cl.c] = null;
      v.pop = 0;
      v.gather = gatherTo && (gatherTo[0] !== cl.r || gatherTo[1] !== cl.c) ? gatherTo : null;
      v.popFace = v.gather ? 'happy' : pickOne(['happy', 'happy', 'squeeze']);
      const [x, y] = this.px(cl.r, cl.c);
      if (cl.kind === 'x') {
        this.view.boxes++;
        this.wake(x, y);
      } else {
        const col = cl.color >= 0 ? cl.color : Math.floor(Math.random() * 6);
        burst(x, y, 3, { img: SPR.icons['heart' + col], speed: 30, up: 25, g: 70, max: 0.6 });
        burst(x, y, 2, { img: sparkSImg(C.white), speed: 22, max: 0.35 });
        if (cl.color >= 0) {
          this.view.collected[cl.color]++;
          this.flyToGoal('collect', cl.color, x, y);
        }
      }
      Sound.sfx.pop((i % 10) + cascade);
    }

    wake(x, y) {
      const k = Math.floor(Math.random() * this.s.nColors);
      emit({ x, y: y - 4, vx: (Math.random() - 0.5) * 40, vy: -95, g: 260, max: 0.9, img: SPR.kitty[k].happy });
      burst(x, y, 6, { color: '#c98646', size: 2, speed: 50, up: 30, g: 120, max: 0.6 });
      burst(x, y - 8, 4, { img: SPR.icons.heartS, speed: 30, up: 30, g: 40, max: 0.8 });
      Sound.sfx.box();
      Sound.sfx.meow(1 + Math.random() * 0.25);
      this.say(pickOne(LINES.wake), 2);
      this.face('happy', 1);
      this.flyToGoal('boxes', -1, x, y);
    }

    flyToGoal(type, color, x, y) {
      const slot = this.goalSlots && this.goalSlots.find((g) => g.type === type && (type !== 'collect' || g.color === color));
      if (!slot) return;
      const img = type === 'collect' ? SPR.icons['heart' + color] : type === 'hearts' ? SPR.icons.heartS : sparkSImg(C.gold);
      emit({ x, y, sx: x, sy: y, tx: slot.x + 10, ty: slot.y + 10, max: 0.45 + Math.random() * 0.15, img });
    }

    transform(tr) {
      const v = this.views.get(tr.id);
      if (!v) return;
      v.kind = tr.kind;
      v.flash = 0.25;
      const [x, y] = this.px(tr.r, tr.c);
      burst(x, y, 3, { img: sparkSImg(C.gold), speed: 25, max: 0.4 });
      Sound.sfx.zing();
    }

    boxHit(bh) {
      const v = this.views.get(bh.id);
      if (!v) return;
      v.hp = bh.hp;
      v.shake = 0.3;
      const [x, y] = this.px(bh.r, bh.c);
      burst(x, y - 6, 6, { color: '#fbe9c2', size: 2, speed: 45, up: 30, g: 120, max: 0.5 });
      Sound.sfx.box();
    }

    heartPop(h) {
      this.hearts[h.r][h.c] = h.left;
      this.view.heartsLeft = Math.max(0, this.view.heartsLeft - 1);
      const [x, y] = this.px(h.r, h.c);
      burst(x, y, 4, { img: SPR.icons.heartS, speed: 35, up: 30, g: 50, max: 0.7 });
      Sound.sfx.heart();
      this.flyToGoal('hearts', -1, x, y);
    }

    createSpecial(cr) {
      const v = new PieceView(cr.piece, cr.r, cr.c);
      v.appear = 0;
      this.addView(v, cr.r, cr.c);
      const [x, y] = this.px(cr.r, cr.c);
      burst(x, y, 6, { img: sparkImg(C.gold), speed: 45, max: 0.5, drag: 3 });
      Sound.sfx.make();
      this.say(pickOne(LINES[cr.piece.kind]), 2.2);
      this.face('wow', 1);
    }

    addPopup(pp) {
      const [x, y] = [BX + pp.c * TILE + TILE / 2, BY + pp.r * TILE + TILE / 2];
      this.popups.push({ x, y, text: '+' + pp.pts, t0: clock.t });
      this.view.score += pp.pts;
    }

    startEffect(ef) {
      this.effects.push(Object.assign({ t0: clock.t, last: 0 }, ef));
      if (ef.type === 'row' || ef.type === 'col') {
        Sound.sfx.zoom();
        this.shake(1.5);
      } else if (ef.type === 'blast') {
        Sound.sfx.yarn();
        this.shake(ef.rad > 1 ? 4 : 2.5);
        const [x, y] = this.px(ef.r, ef.c);
        const pal = KITTIES[Math.max(0, ef.color)];
        burst(x, y, 10, { color: pal.b, size: 2, speed: 70, drag: 2, max: 0.6 });
        burst(x, y, 6, { color: pal.o, size: 1, speed: 90, drag: 2, max: 0.5 });
      } else if (ef.type === 'fly') {
        Sound.sfx.fly();
      } else if (ef.type === 'rainbow') {
        Sound.sfx.rainbow();
        this.face('wow', 1.2);
      } else if (ef.type === 'board') {
        Sound.sfx.board();
        this.shake(6);
      }
    }

    shake(mag) {
      if (!REDUCED) this.shakeMag = Math.max(this.shakeMag, mag);
    }

    showCallout(text, big, level) {
      this.callout = { text, big: !!big, t0: clock.rt };
      if (level) Sound.sfx.cheer(level);
      if (level >= 3) {
        this.mascot.hop = 1;
        this.face('happy', 1);
      }
    }

    fall(st) {
      const moving = [];
      for (const f of st.falls) {
        const v = this.views.get(f.id);
        if (!v) continue;
        if (this.cells[f.fromR][f.c] === v) this.cells[f.fromR][f.c] = null;
        moving.push([v, f]);
      }
      for (const [v, f] of moving) {
        v.ty = f.toR;
        v.falling = true;
        v.vy = 0;
        this.cells[f.toR][f.c] = v;
      }
      for (const sp of st.spawns) {
        const v = new PieceView(sp.piece, sp.fromR, sp.c);
        v.ty = sp.r;
        v.falling = true;
        this.addView(v, sp.r, sp.c);
      }
    }

    async playShuffle(sh) {
      this.showCallout('SHUFFLE!', true);
      this.say('NO MOVES LEFT... SHUFFLE TIME!', 2.5);
      Sound.sfx.rainbow();
      const moved = [];
      for (const m of sh.moves) {
        const v = this.views.get(m.id);
        if (!v) continue;
        v.color = m.color;
        v.move = { fx: m.fromC, fy: m.fromR, tx: m.toC, ty: m.toR, t: 0, dur: 0.55, arc: 1.2 };
        moved.push([v, m]);
      }
      for (const [v, m] of moved) if (this.cells[m.fromR][m.fromC] === v) this.cells[m.fromR][m.fromC] = null;
      for (const [v, m] of moved) this.cells[m.toR][m.toC] = v;
      await sleep(0.6);
    }

    async afterTurn() {
      if (this.cozy) {
        if (this.s.score > save.cozyBest) {
          save.cozyBest = this.s.score;
          persist();
        }
        this.busy = false;
        return;
      }
      const st = E.status(this.s);
      if (st === 'won') return this.win();
      if (st === 'lost') return this.lose();
      const left = this.s.movesLeft;
      if ((left === 5 || left === 3 || left === 1) && !this.warned[left]) {
        this.warned[left] = true;
        this.say(left === 1 ? 'LAST MOVE! MAKE IT COUNT!' : 'ONLY ' + left + ' MOVES LEFT!', 2.5);
        this.face('wow', 1);
      }
      this.busy = false;
    }

    // Runs the moment the engine reports a win, before any animation, so
    // pausing or leaving mid-celebration can never lose it. The bonus round
    // is resolved on a copy and replayed later.
    secureWin() {
      if (this.won) return this.won;
      const after = E.cloneState(this.s);
      const party = after.movesLeft > 0 || after.grid.some((row) => row.some((p) => p && E.isSpecial(p)));
      const steps = party ? E.bonusRound(after) : [];
      const i = this.index;
      const stars = E.starsFor(this.level, after.score);
      const newBest = after.score > (save.best[i] || 0);
      save.stars[i] = Math.max(save.stars[i] || 0, stars);
      save.best[i] = Math.max(save.best[i] || 0, after.score);
      save.unlocked = Math.min(E.LEVELS.length, Math.max(save.unlocked, i + 2));
      persist();
      this.won = { party, steps, after, stars, newBest };
      return this.won;
    }

    async win() {
      this.busy = true;
      this.selected = null;
      const { party, steps, after, stars, newBest } = this.secureWin();
      Sound.sfx.win();
      at(0.35, () => Sound.sfx.meow(1.15));
      this.face('happy', 99);
      this.mascot.hop = 1;
      this.say(pickOne(LINES.win), 3);
      this.showCallout('LEVEL CLEAR!', true);
      confetti(70);
      await sleep(1.5);
      if (party) {
        this.showCallout('KITTY PARTY!', true);
        this.say('LEFTOVER MOVES TURN INTO ZOOMIES!', 3);
        await sleep(0.9);
        for (const st of steps) {
          if (st.transforms.length) this.view.moves = Math.max(0, this.view.moves - st.transforms.length);
          await this.playStep(st);
        }
      }
      this.s = after;
      this.syncView();
      this.face('happy', 99);
      this.showResult(true, stars, newBest);
    }

    async lose() {
      this.busy = true;
      this.selected = null;
      Sound.sfx.lose();
      this.face('sad', 99);
      this.say(pickOne(LINES.lose), 99);
      this.showCallout('OUT OF MOVES', true);
      await sleep(1.4);
      this.showResult(false, 0, false);
    }

    // ----------------------------------------------------------- overlays
    showIntro(key) {
      return new Promise((resolve) => {
        const done = () => {
          this.overlay = null;
          resolve();
        };
        this.overlay = { type: 'intro', key, t0: clock.rt, buttons: [new Button(50, 226, 80, 22, 'YAY!', done, { style: 'pink', scale: 2 })] };
        this.overlay.focusBtn = this.overlay.buttons[0];
        Sound.sfx.make();
      });
    }
    showBanner() {
      return new Promise((resolve) => {
        const done = () => {
          if (this.overlay && this.overlay.type === 'banner') {
            this.overlay = null;
            resolve();
          }
        };
        this.overlay = { type: 'banner', t0: clock.rt, done, buttons: [] };
        at(2.4, done);
      });
    }
    pause() {
      if (this.overlay) return;
      this.selected = null;
      const buttons = [
        new Button(45, 104, 90, 24, 'RESUME', () => { this.overlay = null; }, { style: 'pink', scale: 2 }),
        new Button(45, 134, 90, 20, 'RESTART', () => go(new PlayScene(this.index)), { style: 'mint' }),
        new Button(45, 159, 90, 20, this.cozy ? 'QUIT' : 'LEVELS', () => go(this.cozy ? new TitleScene() : new MapScene()), { style: 'sky' }),
        ...soundButtons(69, 188),
      ];
      this.overlay = { type: 'pause', t0: clock.rt, buttons, focusBtn: buttons[0] };
    }
    autoPause() {
      if (!this.overlay) this.pause();
    }
    showResult(won, stars, newBest) {
      const i = this.index;
      const last = i + 1 >= E.LEVELS.length;
      const buttons = won
        ? [
            new Button(45, 204, 90, 24, last ? 'YAY!' : 'NEXT', () => go(last ? new MapScene() : new PlayScene(i + 1)), { style: 'pink', scale: 2 }),
            new Button(45, 232, 43, 18, 'REPLAY', () => go(new PlayScene(i)), { style: 'mint' }),
            new Button(92, 232, 43, 18, 'LEVELS', () => go(new MapScene()), { style: 'sky' }),
          ]
        : [
            new Button(45, 204, 90, 24, 'TRY AGAIN', () => go(new PlayScene(i)), { style: 'pink' }),
            new Button(45, 232, 90, 18, 'LEVELS', () => go(new MapScene()), { style: 'sky' }),
          ];
      this.overlay = { type: 'result', won, stars, newBest, last, t0: clock.rt, buttons, focusBtn: buttons[0], shown: 0 };
      if (won) {
        for (let k = 0; k < stars; k++) {
          at(0.5 + k * 0.45, () => {
            if (!this.overlay || this.overlay.type !== 'result') return;
            this.overlay.shown = k + 1;
            Sound.sfx.star(k);
            burst(W / 2 - 30 + k * 30, 104 - (k === 1 ? 5 : 0), 8, { img: sparkImg(C.gold), speed: 50, drag: 3, max: 0.6 });
          });
        }
      }
    }
    overlayDown(x, y) {
      const o = this.overlay;
      if (o.type === 'banner') return o.done();
      buttonsDown(o.buttons, x, y);
    }
    overlayUp(x, y) {
      if (this.overlay) buttonsUp(this.overlay.buttons, x, y);
    }
    overlayKey(k) {
      const o = this.overlay;
      if (o.type === 'banner') {
        o.done();
        return true;
      }
      if (k === 'Escape' && o.type === 'pause') {
        this.overlay = null;
        return true;
      }
      return keyNav(o, k);
    }

    // ------------------------------------------------------------- update
    update(dt) {
      if (!dt) return;
      this.t += dt;
      for (const v of this.views.values()) v.update(dt);
      for (const [id, v] of this.views) if (v.pop >= POP) this.views.delete(id);
      const t = clock.t;
      this.effects = this.effects.filter((ef) => {
        const el = t - ef.t0;
        if (ef.type === 'row' || ef.type === 'col') {
          if (el < 8 * E.T.ZOOM && t - ef.last > 0.03) {
            ef.last = t;
            const d = (el / E.T.ZOOM) * TILE;
            const [ox, oy] = this.px(ef.r, ef.c);
            for (const s of [-1, 1]) {
              const x = ef.type === 'row' ? ox + s * d : ox, y = ef.type === 'row' ? oy : oy + s * d;
              if (x > BX && x < BX + 160 && y > BY && y < BY + 160) emit({ x, y: y + 4, img: SPR.icons['paw' + Math.max(0, ef.color)], max: 0.35 });
            }
          }
          return el < 8 * E.T.ZOOM + 0.4;
        }
        if (ef.type === 'fly') {
          if (t - ef.last > 0.04 && el < ef.arrive - ef.t) {
            ef.last = t;
            const [x, y] = this.flyPos(ef, el);
            emit({ x, y: y + 3, img: sparkSImg(C.white), vy: 10, max: 0.4 });
          }
          return el < ef.arrive - ef.t + 0.15;
        }
        if (ef.type === 'rainbow') return el < (ef.arrive || ef.t) - ef.t + 0.35;
        if (ef.type === 'board') return el < 0.9;
        return el < 0.45;
      });
      this.popups = this.popups.filter((p) => t - p.t0 < 0.9);
      if (this.shakeMag > 0) this.shakeMag = Math.max(0, this.shakeMag - dt * 14);
      if (this.scoreShown < this.view.score) this.scoreShown = Math.min(this.view.score, this.scoreShown + Math.max(1, (this.view.score - this.scoreShown) * 8 * dt));
      const m = this.mascot;
      m.blinkT -= dt;
      if (m.blinkT < 0) {
        m.blink = 0.14;
        m.blinkT = 2 + Math.random() * 4;
      }
      if (m.blink > 0) m.blink -= dt;
      if (m.exprT > 0) {
        m.exprT -= dt;
        if (m.exprT <= 0) m.expr = 'open';
      }
      if (m.sayT > 0) {
        m.sayT -= dt;
        if (m.sayT <= 0) m.say = null;
      }
      if (m.hop > 0) m.hop = Math.max(0, m.hop - dt * 1.5);
      if (!this.busy && !this.overlay) {
        this.idle += dt;
        if (this.idle > 7 && !this.hint) {
          this.hint = E.findHint(this.s);
          if (this.hint && !this.hinted) {
            this.hinted = true;
            this.say(pickOne(LINES.hint), 2.5);
          }
        }
        if (this.idle > 30 && m.expr !== 'sleep') {
          this.face('sleep', 9999);
          this.say('ZZZ...', 9999);
        }
      }
    }

    flyPos(ef, el) {
      const k = Math.min(1, el / (ef.arrive - ef.t));
      const [x0, y0] = this.px(ef.r, ef.c);
      const [x1, y1] = ef.to ? this.px(ef.to[0], ef.to[1]) : [x0, y0 - 30];
      const mx = (x0 + x1) / 2 + (y1 - y0) * 0.3, my = Math.min(y0, y1) - 34;
      const a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k;
      return [a * x0 + b * mx + c * x1, a * y0 + b * my + c * y1];
    }

    isHinted(v) {
      const h = this.hint;
      if (!h) return false;
      return this.cells[h.a[0]][h.a[1]] === v || (!!h.b && this.cells[h.b[0]][h.b[1]] === v);
    }

    // --------------------------------------------------------------- draw
    draw() {
      drawSceneBg();
      this.drawHud();
      const sm = this.shakeMag;
      const ox = sm ? Math.round((Math.random() * 2 - 1) * sm) : 0, oy = sm ? Math.round((Math.random() * 2 - 1) * sm) : 0;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.drawImage(this.board, 0, 0);
      this.drawHearts();
      this.drawSelection();
      ctx.save();
      ctx.clip(this.clip);
      const t = clock.t;
      const list = [...this.views.values()];
      list.sort((a, b) => (a.pop >= 0) - (b.pop >= 0) || (a.appear >= 0) - (b.appear >= 0) || (!!a.move - !!b.move));
      for (const v of list) this.drawPiece(v, t);
      this.drawHeartStickers();
      ctx.restore();
      ctx.save();
      ctx.beginPath();
      ctx.rect(BX - 4, BY - 4, 168, 168);
      ctx.clip();
      this.drawEffects();
      ctx.restore();
      ctx.restore();
      drawParticles();
      this.drawPopups();
      this.drawMascot();
      this.drawCallout();
      drawButtons(this);
      if (this.overlay) this.drawOverlay();
    }

    drawPiece(v, t) {
      let cx = BX + v.x * TILE + TILE / 2, cy = BY + v.y * TILE + TILE / 2;
      let sx = 1, sy = 1, face = null;
      const sel = this.selected && v.pop < 0 && !v.move && this.cells[this.selected[0]][this.selected[1]] === v;
      if (v.pop >= 0) {
        const k = Math.min(1, v.pop / POP);
        sx = sy = Math.max(0.05, k < 0.3 ? 1 + k : 1.3 * (1 - (k - 0.3) / 0.7));
        if (v.gather) {
          const [gx, gy] = this.px(v.gather[0], v.gather[1]);
          cx += (gx - cx) * k;
          cy += (gy - cy) * k;
        }
        face = v.popFace;
      } else if (v.appear >= 0) {
        const k = v.appear / 0.35;
        sx = sy = k < 0.6 ? 0.3 + (k / 0.6) : 1.3 - 0.3 * ((k - 0.6) / 0.4);
      } else if (v.squash > 0) {
        sy = 1 - 0.2 * v.squash;
        sx = 1 + 0.14 * v.squash;
        cy += (TILE * (1 - sy)) / 2;
      }
      if (sel) {
        face = 'happy';
        cy -= Math.round(Math.abs(Math.sin(t * 8)) * 2);
      }
      if (this.idle > 7 && v.pop < 0 && this.isHinted(v)) {
        const ph = (this.idle - 7) % 2;
        if (ph < 0.6) cx += Math.round(Math.sin(ph * 40));
      }
      if (v.shake > 0) cx += Math.floor(t * 50) % 2 ? 1 : -1;
      const img = v.kind === 'n' ? SPR.kitty[v.color][face || (v.blink > 0 ? 'blink' : 'open')] : pieceSprite(v, t + v.id * 0.37, v.blink > 0);
      if (E.isSpecial(v) && v.pop < 0) blit(glowOf(img), cx, cy, sx, sy, 0.5 + 0.3 * Math.sin(t * 5 + v.id));
      blit(img, cx, cy, sx, sy);
      if (v.flash > 0) blit(glowOf(img), cx, cy, sx, sy, Math.min(1, v.flash * 5));
    }

    drawHearts() {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const h = this.hearts[r][c];
          if (!h || !this.s.mask[r][c]) continue;
          const x = BX + c * TILE, y = BY + r * TILE;
          ctx.fillStyle = h > 1 ? C.heart2 : C.heart1;
          ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = h > 1 ? '#f0508a' : '#ff8fb8';
          ctx.fillRect(x, y, TILE, 1);
          ctx.fillRect(x, y + TILE - 1, TILE, 1);
          ctx.fillRect(x, y, 1, TILE);
          ctx.fillRect(x + TILE - 1, y, 1, TILE);
        }
      }
    }

    // Little heart stickers on top of the kitties so hearts never hide.
    drawHeartStickers() {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const h = this.hearts[r][c];
          if (!h || !this.s.mask[r][c]) continue;
          const x = BX + c * TILE, y = BY + r * TILE;
          blit(h > 1 ? SPR.icons.sticker2 : SPR.icons.sticker1, x + 16, y + 16);
          if (h > 1) blit(SPR.icons.sticker2, x + 4, y + 16);
        }
      }
    }

    drawSelection() {
      const t = clock.rt;
      const corners = (r, c, col, grow) => {
        const x = BX + c * TILE - grow, y = BY + r * TILE - grow, s = TILE + grow * 2;
        ctx.fillStyle = col;
        for (const [ax, ay, w, h] of [[x, y, 4, 1], [x, y, 1, 4], [x + s - 4, y, 4, 1], [x + s - 1, y, 1, 4], [x, y + s - 1, 4, 1], [x, y + s - 4, 1, 4], [x + s - 4, y + s - 1, 4, 1], [x + s - 1, y + s - 4, 1, 4]]) ctx.fillRect(ax, ay, w, h);
      };
      if (this.selected) {
        const [r, c] = this.selected;
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillRect(BX + c * TILE + 1, BY + r * TILE + 1, TILE - 2, TILE - 2);
        corners(r, c, C.gold, Math.floor(t * 4) % 2);
      }
      if (this.cursor && !this.busy) corners(this.cursor[0], this.cursor[1], C.ink, 0);
    }

    drawEffects() {
      const t = clock.t;
      for (const ef of this.effects) {
        const el = t - ef.t0;
        const col = Math.max(0, ef.color);
        const pal = KITTIES[col];
        const [ox, oy] = this.px(ef.r, ef.c);
        if (ef.type === 'row' || ef.type === 'col') {
          const horiz = ef.type === 'row';
          const d = el / E.T.ZOOM;
          const fade = el > 8 * E.T.ZOOM ? Math.max(0, 1 - (el - 8 * E.T.ZOOM) / 0.4) : 1;
          const reach = Math.round(Math.min(d, 8) * TILE);
          ctx.globalAlpha = fade;
          ctx.fillStyle = pal.b;
          if (horiz) ctx.fillRect(ox - reach, oy - 3, reach * 2, 7);
          else ctx.fillRect(ox - 3, oy - reach, 7, reach * 2);
          ctx.fillStyle = C.white;
          if (horiz) ctx.fillRect(ox - reach, oy - 1, reach * 2, 3);
          else ctx.fillRect(ox - 1, oy - reach, 3, reach * 2);
          ctx.globalAlpha = 1;
          if (d < 8) {
            const img = (horiz ? SPR.zoomH : SPR.zoomV)[col].open;
            for (const s of [-1, 1]) {
              const x = horiz ? ox + s * d * TILE : ox, y = horiz ? oy : oy + s * d * TILE;
              blit(glowOf(img), x, y - (Math.floor(el * 30) % 2));
              blit(img, x, y - (Math.floor(el * 30) % 2));
            }
          }
        } else if (ef.type === 'blast') {
          const k = Math.min(1, el / 0.4);
          const rad = (ef.rad + 0.7) * TILE * (1 - Math.pow(1 - k, 3));
          ctx.globalAlpha = 1 - k;
          circlePx(ox, oy, rad, C.white);
          circlePx(ox, oy, rad - 1, pal.b);
          circlePx(ox, oy, rad - 2, pal.o);
          circlePx(ox, oy, rad * 0.6, pal.h);
          ctx.globalAlpha = 1;
          if (k < 0.45) blit(SPR.yarn[col], ox, oy, 1 + k * 1.5, 1 + k * 1.5, 1 - k * 2);
        } else if (ef.type === 'fly') {
          if (el < ef.arrive - ef.t) {
            const [x, y] = this.flyPos(ef, el);
            if (ef.carry) blit(ef.carry === 'y' ? SPR.yarn[col] : (ef.carry === 'h' ? SPR.zoomH : SPR.zoomV)[col].open, x, y + 7, 0.8, 0.8);
            blit(SPR.fly[col][Math.floor(el * 12) % 2], x, y);
          }
        } else if (ef.type === 'rainbow') {
          const total = (ef.arrive || ef.t) - ef.t;
          if (el < total + 0.25) blit(SPR.rainbow[Math.floor(el * 12) % 6], ox, oy, 1.2, 1.2);
          for (const tg of ef.targets) {
            const rel = tg.t - ef.t;
            if (el >= rel && el < rel + 0.3) {
              const [x1, y1] = this.px(tg.r, tg.c);
              linePx(ox, oy, x1, y1, RAINBOW[(Math.floor(el * 20) + tg.r + tg.c) % 6], 3);
              linePx(ox, oy, x1, y1, C.white, 1);
              blit(sparkImg(C.white), x1, y1);
            }
          }
        } else if (ef.type === 'board') {
          const k = el / 0.9;
          ctx.globalAlpha = Math.max(0, 1 - k);
          ctx.fillStyle = C.white;
          ctx.beginPath();
          ctx.arc(ox, oy, k * 240, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          for (let i = 0; i < 6; i++) if (k * 200 - i * 3 > 0) circlePx(ox, oy, k * 200 - i * 3, RAINBOW[i]);
        }
      }
    }

    drawPopups() {
      for (const p of this.popups) {
        const el = clock.t - p.t0;
        ctx.globalAlpha = el > 0.6 ? Math.max(0, 1 - (el - 0.6) / 0.3) : 1;
        drawText(ctx, p.text, p.x, p.y - 4 - el * 14, C.gold, { align: 'center', outline: C.ink });
        ctx.globalAlpha = 1;
      }
    }

    drawCallout() {
      const c = this.callout;
      if (!c) return;
      const el = clock.rt - c.t0;
      if (el > 1.4) {
        this.callout = null;
        return;
      }
      const scale = el < 0.07 ? 1 : c.big && textWidth(c.text, 3) <= 172 ? 3 : 2;
      const y = BY + 72 - (el < 0.15 ? Math.round((0.15 - el) * 40) : 0);
      ctx.globalAlpha = el > 1.1 ? Math.max(0, 1 - (el - 1.1) / 0.3) : 1;
      drawText(ctx, c.text, W / 2, y, C.white, { scale, align: 'center', outline: C.ink, shadow: '#b83a6d', wave: REDUCED ? 0 : 1, t: el, colors: RAINBOW });
      ctx.globalAlpha = 1;
    }

    drawHud() {
      const panel = (x, w) => rrect(x, 3, w, 27, '#fff8fb', '#e7a3c0', { hi: C.white, shadow: '#f5c6d8' });
      panel(3, 52);
      drawText(ctx, this.cozy ? 'COZY' : 'LEVEL', 29, 7, C.inkSoft, { align: 'center' });
      if (this.cozy) blit(SPR.icons.heart, 29, 21);
      else drawText(ctx, String(this.index + 1), 29, 15, C.ink, { scale: 2, align: 'center' });
      panel(58, 50);
      drawText(ctx, this.cozy ? 'BEST' : 'MOVES', 83, 7, C.inkSoft, { align: 'center' });
      if (this.cozy) drawText(ctx, String(Math.max(save.cozyBest, Math.floor(this.scoreShown))), 83, 18, C.ink, { align: 'center' });
      else {
        const low = this.view.moves <= 5;
        drawText(ctx, String(Math.max(0, this.view.moves)), 83, 15, low ? (Math.floor(clock.rt * 3) % 2 ? C.hot : '#d62a5a') : C.ink, { scale: 2, align: 'center' });
      }
      panel(111, 46);
      drawText(ctx, 'SCORE', 134, 7, C.inkSoft, { align: 'center' });
      drawText(ctx, String(Math.floor(this.scoreShown)), 134, 18, C.ink, { align: 'center' });
      rrect(3, 33, 174, 25, '#fff8fb', '#e7a3c0', { hi: C.white, shadow: '#f5c6d8' });
      this.drawGoals(90, 35, true);
      if (!this.cozy) {
        const st = this.level.stars, max = st[2];
        const k = Math.min(1, this.scoreShown / max);
        rrect(4, 60, 172, 9, '#fff8fb', '#e7a3c0');
        ctx.fillStyle = C.pink;
        ctx.fillRect(7, 62, Math.round(166 * k), 5);
        ctx.fillStyle = '#ffd3e4';
        ctx.fillRect(7, 62, Math.round(166 * k), 1);
        const off = lazyIcon('starOff', ICONS.starS, { y: '#e9c7d6' });
        for (let i = 0; i < 3; i++) blit(this.scoreShown >= st[i] ? SPR.icons.starS : off, Math.min(170, 7 + Math.round(166 * (st[i] / max))), 64);
      }
    }

    drawGoals(cx, y, record) {
      if (this.cozy) {
        drawText(ctx, 'JUST RELAX AND MATCH! ♥', cx, y + 8, C.inkSoft, { align: 'center' });
        return;
      }
      const items = this.goals.map((g) => {
        let left, img;
        if (g.type === 'collect') {
          left = Math.max(0, g.need - this.view.collected[g.color]);
          img = SPR.kitty[g.color].open;
        } else if (g.type === 'hearts') {
          left = this.view.heartsLeft;
          img = heartTileIcon();
        } else if (g.type === 'boxes') {
          left = Math.max(0, g.need - this.view.boxes);
          img = SPR.box[1][0];
        } else {
          left = Math.max(0, g.need - this.view.score);
          img = SPR.icons.star;
        }
        const text = g.type === 'score' ? String(g.need) : String(left);
        const done = left <= 0;
        return { g, img, text, done, w: 22 + (done ? 7 : textWidth(text)) };
      });
      const gap = 7;
      const total = items.reduce((a, it) => a + it.w, 0) + gap * (items.length - 1);
      let x = Math.round(cx - total / 2);
      const slots = [];
      for (const it of items) {
        blit(it.img, x + 10, y + 10);
        if (it.done) blit(checkIcon(), x + 25, y + 10);
        else drawText(ctx, it.text, x + 22, y + 8, C.ink);
        slots.push({ type: it.g.type, color: it.g.color, x, y });
        x += it.w + gap;
      }
      if (record) this.goalSlots = slots;
    }

    drawMascot() {
      const m = this.mascot;
      rrect(-4, 303, W + 8, 22, '#ffd3e4', '#e7a3c0', { hi: '#ffe8f1' });
      const hop = m.hop > 0 && !REDUCED ? Math.round(Math.abs(Math.sin(m.hop * Math.PI * 4)) * 5 * m.hop) : 0;
      const expr = m.expr === 'open' && m.blink > 0 ? 'blink' : m.expr;
      ctx.drawImage(SPR.mascot[expr] || SPR.mascot.open, 6, 265 - hop, 40, 40);
      for (const x of [12, 32]) rrect(x, 300, 8, 5, C.white, '#8c5a78');
      if (m.expr === 'sleep') drawText(ctx, 'Z', 44 + (Math.floor(clock.rt * 2) % 3) * 3, 262 - (Math.floor(clock.rt * 2) % 3) * 4, '#8f86b0');
      if (!m.say) return;
      const lines = wrap(m.say, 112).slice(0, 4);
      const h = lines.length * 8 + 8;
      const y = Math.round(281 - h / 2);
      rrect(52, y, 124, h, C.white, '#c7799c', { shadow: '#f5c6d8' });
      ctx.fillStyle = '#c7799c';
      ctx.fillRect(48, 280, 5, 1);
      ctx.fillRect(49, 281, 4, 1);
      ctx.fillRect(50, 282, 3, 1);
      ctx.fillStyle = C.white;
      ctx.fillRect(51, 281, 2, 1);
      lines.forEach((ln, i) => drawText(ctx, ln, 114, y + 5 + i * 8, C.ink, { align: 'center' }));
    }

    drawOverlay() {
      const o = this.overlay;
      const el = clock.rt - o.t0;
      if (o.type === 'banner') {
        const slide = el < 0.25 ? (1 - el / 0.25) * -190 : el > 2.1 ? (el - 2.1) * 700 : 0;
        const x = Math.round(8 + slide);
        rrect(x, 118, 164, 70, C.paper, '#c7799c', { hi: C.white, shadow: '#b0668a' });
        ctx.save();
        ctx.translate(x - 8, 0);
        drawText(ctx, 'LEVEL ' + (this.index + 1), W / 2, 125, C.hot, { scale: 2, align: 'center', outline: C.white });
        drawText(ctx, this.level.name, W / 2, 140, C.ink, { align: 'center' });
        this.drawGoals(W / 2, 148, false);
        drawText(ctx, this.level.moves + ' MOVES', W / 2, 176, C.inkSoft, { align: 'center' });
        ctx.restore();
        return;
      }
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = C.ink;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      if (o.type === 'intro') {
        const info = INFO[o.key];
        rrect(14, 56, 152, 200, C.paper, '#c7799c', { hi: C.white, shadow: '#b0668a' });
        drawText(ctx, 'NEW!', W / 2, 64, C.hot, { scale: 2, align: 'center', outline: C.white });
        drawText(ctx, info.name, W / 2, 80, C.ink, { scale: 2, align: 'center' });
        const img = info.img();
        const bob = REDUCED ? 0 : Math.round(Math.sin(clock.rt * 4) * 2);
        const bx = info.img2 ? W / 2 - 22 : W / 2;
        ctx.drawImage(glowOf(img), bx - 33, 96 + bob, 66, 66);
        ctx.drawImage(img, bx - 30, 99 + bob, 60, 60);
        if (info.img2) ctx.drawImage(info.img2(), W / 2 + 18, 116 - bob, 40, 40);
        let yy = 170;
        for (const ln of wrap(info.how, 136)) { drawText(ctx, ln, W / 2, yy, C.ink, { align: 'center' }); yy += 8; }
        yy += 3;
        for (const ln of wrap(info.what, 136)) { drawText(ctx, ln, W / 2, yy, C.hot, { align: 'center' }); yy += 8; }
      } else if (o.type === 'pause') {
        rrect(30, 70, 120, 146, C.paper, '#c7799c', { hi: C.white, shadow: '#b0668a' });
        drawText(ctx, 'PAUSED', W / 2, 80, C.ink, { scale: 2, align: 'center' });
        blit(SPR.mascot.sleep, 136, 84);
      } else if (o.type === 'result') {
        rrect(14, 52, 152, 206, C.paper, '#c7799c', { hi: C.white, shadow: '#b0668a' });
        if (o.won) {
          drawText(ctx, o.last ? 'ALL CLEAR!' : 'LEVEL CLEAR!', W / 2, 60, C.hot, { scale: 2, align: 'center', outline: C.white, wave: REDUCED ? 0 : 1, t: clock.rt });
          for (let k = 0; k < 3; k++) {
            const x = W / 2 - 30 + k * 30, y = 92 - (k === 1 ? 5 : 0);
            const img = k < o.shown ? SPR.icons.star : SPR.icons.starDim;
            ctx.drawImage(img, x - 9, y, 18, 14);
          }
          drawText(ctx, 'SCORE', W / 2, 116, C.inkSoft, { align: 'center' });
          drawText(ctx, String(this.s.score), W / 2, 124, C.ink, { scale: 2, align: 'center' });
          if (o.newBest) drawText(ctx, 'NEW BEST!', W / 2, 138, C.hot, { align: 'center' });
          ctx.drawImage(SPR.mascot[Math.floor(clock.rt * 2) % 2 ? 'happy' : 'open'], W / 2 - 20, 148, 40, 40);
          drawText(ctx, o.last ? 'YOU BEAT ALL 20 LEVELS! ♥' : 'YOU ARE PAWSOME!', W / 2, 192, C.ink, { align: 'center' });
        } else {
          drawText(ctx, 'OUT OF MOVES', W / 2, 62, C.ink, { scale: 2, align: 'center' });
          ctx.drawImage(SPR.mascot.sad, W / 2 - 20, 80, 40, 40);
          drawText(ctx, 'STILL TO GO:', W / 2, 128, C.inkSoft, { align: 'center' });
          this.drawGoals(W / 2, 138, false);
          drawText(ctx, 'SO CLOSE! TRY AGAIN?', W / 2, 172, C.hot, { align: 'center' });
          drawText(ctx, 'SCORE ' + this.s.score, W / 2, 184, C.inkSoft, { align: 'center' });
        }
      }
      for (const b of o.buttons) b.draw(b === o.focusBtn);
    }
  }

  // ================================================================= boot
  function toInternal(e) {
    const r = screenEl.getBoundingClientRect();
    return [((e.clientX - r.left) * W) / r.width, ((e.clientY - r.top) * H) / r.height];
  }
  screenEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    Sound.unlock();
    screenEl.focus({ preventScroll: true });
    if (screenEl.setPointerCapture) {
      try { screenEl.setPointerCapture(e.pointerId); } catch (err) { /* synthetic events */ }
    }
    const [x, y] = toInternal(e);
    if (scene.down) scene.down(x, y);
  });
  screenEl.addEventListener('pointermove', (e) => {
    const [x, y] = toInternal(e);
    if (scene.move) scene.move(x, y);
  });
  const release = (e) => {
    Sound.unlock();
    const [x, y] = toInternal(e);
    if (scene.up) scene.up(x, y);
  };
  screenEl.addEventListener('pointerup', release);
  screenEl.addEventListener('pointercancel', release);
  screenEl.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    Sound.unlock();
    if (e.key === 'm' || e.key === 'M') {
      save.music = !save.music;
      persist();
      if (!save.music) Sound.stopMusic();
      Sound.applyVolumes();
      return;
    }
    if (scene.key && scene.key(e.key) !== false && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      Sound.suspend(true);
      if (scene.autoPause) scene.autoPause();
    } else Sound.suspend(false);
  });

  let last = performance.now();
  function frame(now) {
    const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    clock.rt += rdt;
    const frozen = !!(scene.frozen && scene.frozen());
    const dt = frozen ? 0 : rdt * clock.scale;
    if (!frozen) {
      tickClock(dt);
      updateParticles(dt);
    }
    scene.update(dt, rdt);
    scene.draw();
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(buf, 0, 0, screenEl.width, screenEl.height);
    requestAnimationFrame(frame);
  }

  buildSprites();
  resize();
  go(new TitleScene());
  requestAnimationFrame(frame);

  // A small handle for tests and curious kitties.
  window.__purr = {
    E, go, clock, save, SPR, KITTIES, buildSprites, drawText, makeCanvas, paintKitty, buf,
    scenes: { TitleScene, MapScene, HowToScene, PlayScene },
    get scene() { return scene; },
  };

})();
</script>
</body>
</html>
